[package]
name = "fortknox-cascade-crypto"
version = "1.0.0"
authors = ["Fort-Knox Cryptography Engineering Team"]
edition = "2021"
description = "High-throughput 4-layer cascade file encryption (Threefish-1024, Serpent-256, ChaCha20-Poly1305, AES-256-GCM) with zero-RAM streaming for WebAssembly"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["simd"]
simd = []

[dependencies]
wasm-bindgen = "0.2.99"
js-sys = "0.3.76"
web-sys = { version = "0.3.76", features = ["console"] }

# Audited RustCrypto implementations
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
cipher = { version = "0.4.4", features = ["block-padding", "zeroize"] }
ctr = "0.9.2"
serpent = "0.4.0"
threefish = "0.6.0"
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
hmac = "0.12.1"
sha2 = "0.10.8"
getrandom = { version = "0.2.15", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.49"
hex-literal = "0.4.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
