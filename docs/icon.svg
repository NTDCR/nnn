<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  
  <!-- Outer Shield Layer 4 (AES-256) -->
  <path d="M 256 60 C 370 60 410 110 410 240 C 410 350 310 430 256 460 C 202 430 102 350 102 240 C 102 110 142 60 256 60 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="8" stroke-dasharray="12 6" opacity="0.85" />
        
  <!-- Layer 3 Ring (ChaCha20) -->
  <path d="M 256 95 C 345 95 380 135 380 240 C 380 330 300 395 256 422 C 212 395 132 330 132 240 C 132 135 167 95 256 95 Z" 
        fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.75" />

  <!-- Layer 2 Ring (Serpent) -->
  <path d="M 256 130 C 320 130 350 165 350 240 C 350 310 290 365 256 386 C 222 365 162 310 162 240 C 162 165 192 130 256 130 Z" 
        fill="none" stroke="#818cf8" stroke-width="6" stroke-dasharray="8 4" opacity="0.9" />

  <!-- Layer 1 Inner Core (Threefish) -->
  <path d="M 256 165 C 295 165 318 190 318 240 C 318 290 278 335 256 350 C 234 335 194 290 194 240 C 194 190 217 165 256 165 Z" 
        fill="#1e1b4b" stroke="url(#goldGrad)" stroke-width="5" />

  <!-- Central Vault Shackle & Keyhole -->
  <rect x="232" y="210" width="48" height="42" rx="8" fill="#fbbf24" filter="url(#glow)" />
  <path d="M 242 210 L 242 195 C 242 184 250 176 256 176 C 262 176 270 184 270 195 L 270 210" 
        fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" />
  <circle cx="256" cy="226" r="4.5" fill="#0f172a" />
  <polygon points="253,227 259,227 257,242 255,242" fill="#0f172a" />
</svg>
